<mat-card>
    <h2 class="alinear">Listado de usuarios</h2>
    <mat-card-header class="usuarios-header">
        <div class="busqueda">
            <mat-form-field hintLabel="Buscar" appearance="fill">
                <mat-label>Buscar por Id</mat-label>
                <input matInput #input >
            </mat-form-field>
        </div>
        <div class="acciones">
            <button mat-raised-button color="primary" (click)="openFormCreateUser()">
                Agregar usuario
            </button>
        </div>
    </mat-card-header>
    <mat-card-content>
        <table mat-table class="mat-cell" [dataSource]="dataSource">
            <ng-container matColumnDef="Apellidos">
                <th *matHeaderCellDef mat-header-cell>Apellidos</th>
                <td mat-cell *matCellDef="let user">
                    <ng-container *ngIf="user">
                        {{user.lastName}}
                    </ng-container>
                </td>
            </ng-container>
            <ng-container matColumnDef="Nombres">
                <th *matHeaderCellDef mat-header-cell>Nombres</th>
                <td mat-cell *matCellDef="let user">
                    <ng-container *ngIf="user">
                        {{user.firstName}}
                    </ng-container>
                </td>
            </ng-container>
            <ng-container matColumnDef="Username">
                <th *matHeaderCellDef mat-header-cell>Username</th>
                <td mat-cell *matCellDef="let user">
                    <ng-container *ngIf="user">
                        {{user.userName}}
                    </ng-container>
                </td>
            </ng-container>
            <ng-container matColumnDef="Email">
                <th *matHeaderCellDef mat-header-cell>Email</th>
                <td mat-cell *matCellDef="let user">
                    <ng-container *ngIf="user">
                        {{user.email}}
                    </ng-container>
                </td>
            </ng-container>
            <ng-container matColumnDef="Telefono">
                <th *matHeaderCellDef mat-header-cell>Telefono</th>
                <td mat-cell *matCellDef="let user">
                    <ng-container *ngIf="user">
                        {{user.phoneNumber}}
                    </ng-container>
                </td>
            </ng-container>
            <ng-container matColumnDef="Roles">
                <th *matHeaderCellDef mat-header-cell>Roles</th>
                <td mat-cell *matCellDef="let user">
                    <ng-container *ngIf="user">
                        {{user.roles}}
                    </ng-container>
                </td>
            </ng-container>    
            <ng-container matColumnDef="Acciones">
                <th *matHeaderCellDef mat-header-cell>Acciones</th>
                <td mat-cell *matCellDef="let user; let i=index">
                    <button mat-icon-button color="accent" (click)="openFormEdirUser(user)">
                        <mat-icon aria-label="Edit">
                            edit
                        </mat-icon>
                    </button>
                    <button mat-icon-button color="accent" (click)="deleteUser(user.id)">
                        <mat-icon aria-label="Delete">
                            delete
                        </mat-icon>
                    </button>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
        </table>
        <mat-paginator [pageSizeOptions]="[5,10,20]" showFirstLastButtons=""></mat-paginator>
    </mat-card-content>
</mat-card>
