<mat-card>
    <h2 class="alinear">Listado de Roles</h2>
    <mat-card-header class="usuarios-header">
        <div class="busqueda">
            <mat-form-field hintLabel="Buscar" appearance="fill">
                <mat-label>Buscar por Id</mat-label>
                <input matInput #input >
            </mat-form-field>
        </div>
        <div class="acciones">
            <button mat-raised-button color="primary" (click)="openFormCreateRole()">
                Agregar role
            </button>
        </div>
    </mat-card-header>
    <mat-card-content>
        <table mat-table class="mat-cell" [dataSource]="dataSource">
            <ng-container matColumnDef="Codigo">
                <th *matHeaderCellDef mat-header-cell>Codigo</th>
                <td mat-cell *matCellDef="let role">
                    <ng-container *ngIf="role">
                        {{role.id}}
                    </ng-container>
                </td>
            </ng-container>
            <ng-container matColumnDef="Nombre">
                <th *matHeaderCellDef mat-header-cell>Nombre</th>
                <td mat-cell *matCellDef="let role">
                    <ng-container *ngIf="role">
                        {{role.name}}
                    </ng-container>
                </td>
            </ng-container>    
            <ng-container matColumnDef="Acciones">
                <th *matHeaderCellDef mat-header-cell>Acciones</th>
                <td mat-cell *matCellDef="let role; let i=index">
                    <button mat-icon-button color="accent" (click)="openFormEditRole(role)">
                        <mat-icon aria-label="Edit">
                            edit
                        </mat-icon>
                    </button>
                    <button mat-icon-button color="accent" (click)="deleteRole(role.id)">
                        <mat-icon aria-label="Delete">
                            delete
                        </mat-icon>
                    </button>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
        </table>
        <mat-paginator [pageSizeOptions]="[5,10,20]" showFirstLastButtons=""></mat-paginator>
    </mat-card-content>
</mat-card>
