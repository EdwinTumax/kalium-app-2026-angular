<mat-nav-list>

    <mat-list-item (click)="dashboardView()">
        <div class="menu-item">
            <mat-icon>dashboard</mat-icon>
            <span class="menu-text">Dashboard</span>
        </div>
    </mat-list-item>

    <mat-list-item (click)="admissionExamView()">
        <div class="menu-item">
            <mat-icon>calendar_month</mat-icon>
            <span class="menu-text">Examenes admisión</span>
        </div>
    </mat-list-item>

    <mat-list-item *ngIf="authService.hasRole('ROLE_STUDENT')">
        <div class="menu-item">
            <mat-icon>credit_card</mat-icon>
            <span class="menu-text">Cuenta corriente</span>
        </div>
    </mat-list-item>

    <mat-list-item *ngIf="authService.hasRole('ROLE_CANDIDATE')">
        <div class="menu-item">
            <mat-icon>event_available</mat-icon>
            <span class="menu-text">Resultado Examen</span>
        </div>

    </mat-list-item>

    <mat-list-item *ngIf="authService.isAuthenticated() && authService.hasRole('ROLE_USER')" (click)="userView()">
        <div class="menu-item">
            <mat-icon>people</mat-icon>
            <span class="menu-text">Usuarios</span>
        </div>
    </mat-list-item>

    <mat-list-item *ngIf="authService.isAuthenticated() && authService.hasRole('ROLE_USER')" (click)="roleView()">
        <div class="menu-item">
            <mat-icon>security</mat-icon>
            <span class="menu-text">Roles</span>
        </div>
    </mat-list-item>

</mat-nav-list>
